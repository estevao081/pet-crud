server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway

# URLs dos serviços. Em Docker Compose os nomes dos serviços viram DNS (ex.: http://user-service:8082).
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  pet:
    url: ${PET_SERVICE_URL:http://localhost:8083}

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:10}
    period-seconds: ${RATE_LIMIT_PERIOD_SECONDS:60}

jwt:
  secret: ${SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
