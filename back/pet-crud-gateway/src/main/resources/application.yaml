
spring:
  application:
    name: pet-crud-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # AUTH SERVICE
            - id: pet-crud-auth
              uri: http://localhost:8082
              predicates:
                - Path=/auth/**

            # USER SERVICE
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/users/**

            # PET SERVICE
            - id: pet-service
              uri: http://localhost:8081
              predicates:
                - Path=/pets/**

server:
  port: 8083