[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/bin/bash -c "su postgres -c '/usr/lib/postgresql/%(ENV_PG_VERSION)s/bin/postgres -D /var/lib/postgresql/data'"
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log
startsecs=5

[program:backend]
command=/bin/bash -c "until pg_isready -h 127.0.0.1 -U %(ENV_POSTGRES_USER)s -d %(ENV_POSTGRES_DB)s -q; do sleep 1; done; exec java -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -jar /app/backend.jar"
autostart=true
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_err.log
startsecs=10

[program:nginx]
command=/bin/bash -c "until (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; do sleep 2; done; exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
startretries=100
