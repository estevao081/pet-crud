[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/bin/bash -c "su postgres -c '/usr/lib/postgresql/%(ENV_PG_VERSION)s/bin/postgres -D /var/lib/postgresql/data'"
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log
startsecs=5

# --- Microservicos (cada um e uma JVM propria; -Xmx limita a memoria total do container) ---

[program:user-service]
command=/bin/bash -c "until pg_isready -h 127.0.0.1 -U %(ENV_POSTGRES_USER)s -q; do sleep 1; done; exec java -Xmx192m -jar /app/user-service.jar"
environment=SERVER_PORT="8082",POSTGRES_URL="jdbc:postgresql://127.0.0.1:5432/%(ENV_USER_DB)s"
autostart=true
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/user-service.log
stderr_logfile=/var/log/supervisor/user-service_err.log
startsecs=10

[program:pet-service]
command=/bin/bash -c "until pg_isready -h 127.0.0.1 -U %(ENV_POSTGRES_USER)s -q; do sleep 1; done; exec java -Xmx768m -jar /app/pet-service.jar"
environment=SERVER_PORT="8083",POSTGRES_URL="jdbc:postgresql://127.0.0.1:5432/%(ENV_PET_DB)s"
autostart=true
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/pet-service.log
stderr_logfile=/var/log/supervisor/pet-service_err.log
startsecs=10

[program:auth-service]
command=/bin/bash -c "exec java -Xmx192m -jar /app/auth-service.jar"
environment=SERVER_PORT="8081"
autostart=true
autorestart=true
priority=3
stdout_logfile=/var/log/supervisor/auth-service.log
stderr_logfile=/var/log/supervisor/auth-service_err.log
startsecs=10

[program:gateway]
command=/bin/bash -c "exec java -Xmx192m -jar /app/gateway.jar"
environment=SERVER_PORT="8080"
autostart=true
autorestart=true
priority=4
stdout_logfile=/var/log/supervisor/gateway.log
stderr_logfile=/var/log/supervisor/gateway_err.log
startsecs=10

[program:nginx]
command=/bin/bash -c "until (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; do sleep 2; done; exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
startretries=100
